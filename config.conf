# ============================================================
# Plex Auto Scan - Plex Server Configuration
# Edit this file, then run install.sh to apply changes.
# Installed location: /usr/local/bin/plex-auto-scan/config.conf
#
# To find your Plex token and section IDs, run:
#   bash /usr/local/bin/plex-auto-scan/get-plex-info.sh
# Or visit in a browser:
#   http://localhost:32400/library/sections/?X-Plex-Token=YOUR_PLEX_TOKEN
# ============================================================

# --- Plex server ---
PLEX_TOKEN="YOUR_PLEX_TOKEN_HERE"
PLEX_URL="http://localhost:32400"

# --- SSH connection (for the trigger script on your torrent box) ---
# These are used by plex-trigger.sh which runs on the qBittorrent host.
SSH_USER="root"
SSH_HOST="YOUR_PLEX_SERVER_IP"
SSH_PORT="22"
SSH_KEY="/path/to/your/ssh/key"
REMOTE_SCRIPT="/usr/local/bin/plex-auto-scan/plex-refresh.sh"

# --- Log file ---
LOG_FILE="/var/log/plex-refresh.log"

# --- Plex library section IDs ---
# Map each qBittorrent category (lowercase) to its Plex section ID.
# qBittorrent category -> Plex library
SECTION_4KMOVIE="3"       # 4KMovie      -> 4K Movies
SECTION_DOCUMENTARY="4"   # Documentary  -> Documentary
SECTION_MOVIE="2"         # Movie        -> Movies
SECTION_STANDUP="5"       # Standup      -> Standup Comedy
SECTION_TV_SHOW="1"       # TV-Show      -> TV Shows

# Fallback section used when the category does not match any of the above
SECTION_DEFAULT="1"